# ==============================================================================
# Connection Settings
# ==============================================================================

# The primary connection string for the MongoDB target. 
# Can be overridden via environment variable: PLGM_URI
uri: "mongodb://dan-ps-lab-mongos00.tp.int.percona.com,dan-ps-lab-mongos01.tp.int.percona.com:27017"

# --- Connection Tuning ---
# Standard driver parameters to control behavior and resource usage.
connection_params:
  # Credentials (Optional)
  # You can set the username here or via env PLGM_USERNAME.
  # Password is NOT set here. Use PLGM_PASSWORD. If not set, the interactive prompt will ask for it
  username: ""
  auth_source: admin             # Database to authenticate against
  direct_connection: false       # Connect directly to the host (bypass topology discovery if single node), use True if replicaset, False if connecting to a sharded cluster
  replicaset_name: ""            # Required if connecting to a Replica Set, set to "" if connecting to a sharded cluster
  read_preference: nearest
  connection_timeout: 30         # Time (seconds) to wait for an initial connection
  server_selection_timeout: 15   # Time (seconds) to wait to find a suitable server for an op
  
  # Pooling: Important for high concurrency.
  # Ensure max_pool_size is > concurrency to avoid workers blocking on sockets.
  max_pool_size: 200             
  min_pool_size: 10              
  max_idle_time: 30              # Max time (minutes) an idle connection stays open (prevents churn)
  # TLS client settings are optional.
  # If both fields are provided, PLGM automatically sets tls=true in the MongoDB URI.
  # Leave both blank to connect without TLS.
  tls_ca_file: ""
  tlsCertificateKeyFile: ""

# --- Custom Driver Options ---
# Arbitrary key-values appended to the connection string URI.
# All mongodb connection parameters are supported, just add them below as shown in the examples
custom_params:
  # Network compression. Use "zlib" for slow networks, "snappy" for speed, or remove for none.
  # Disabling compressors could speed up the workload
  compressors: "zlib,snappy"
  
# Enable debug logging (verbose).
debug: false

# Enable PPROF server on localhost:6060 for profiling (default: false)
# Can be overridden via env: PLGM_PPROF_ENABLED=true
pprof_enabled: false

# ==============================================================================
# Web UI Configuration
# ==============================================================================
web_ui:
  enabled: false
  port: 9999
  # By default the Web UI is served over plain HTTP bound to the loopback
  # interface (127.0.0.1). Browsers treat http://localhost as a secure context,
  # so there are NO certificate warnings. Only enable TLS if you expose the UI
  # beyond loopback.
  tls_enabled: false
  # When tls_enabled is true, provide a certificate/key trusted by your clients
  # to avoid browser warnings. If left blank while TLS is enabled, a temporary
  # self-signed certificate is used (browsers will warn until it is trusted).
  tls_cert_file: ""
  tls_key_file: ""

# ==============================================================================
# Metrics Export
# ==============================================================================
# Continuously stream workload throughput metrics to a CSV file for graphing
csv_export_enabled: false
csv_export_append: false # If true, appends to the file. If false, overwrites it.
csv_export_path: "/tmp/plgm_metrics_export.csv"

# ==============================================================================
# Post-Run Insights (Slow Query / Index Analysis)
# ==============================================================================
# Insights are generated after workload completion.
# Explain mode is post-run only and does not execute during the measured workload window.
insights_enabled: true
insights_sampling_rate: 0.10
insights_slow_threshold_ms: 200
insights_max_events: 5000
insights_max_groups: 300
insights_explain_enabled: true
insights_explain_top_n: 5
insights_explain_max_time_ms: 1000
insights_explain_verbosity: "executionStats"
# Modes: high_only (default), medium_only, critical_only, high_and_low
insights_explain_severity_mode: "high_only"
# Extra Top N slots chosen regardless of slow threshold/severity: impact_and_latency_tiers (default), off
insights_explain_efficiency_mode: "impact_and_latency_tiers"
insights_explain_workers: 1
insights_explain_retries: 1
insights_explain_backoff_ms: 150
# Query latency targets (ms) for the Query latency rating; 0 = no target.
# insights_latency_target_avg_ms: 0
# insights_latency_target_p95_ms: 0
# insights_latency_target_p99_ms: 0

# ==============================================================================
# Trend History (Trends view; see README "Trend history")
# ==============================================================================
# Unpinned runs to keep per store (1-50). Pinned runs (max 10) are extra.
trend_history_runs: 5
# Unpinned runs older than this are not compared (0 = never; max 3650).
trend_max_age_days: 30
# Store file; empty = <user config dir>/plgm/trend_baselines.json, "off" disables.
# Several instances may share one file.
# trend_baseline_store: ""
# Baseline for each shape: "previous" (previous compatible run) or "pinned".
trend_default_comparison: "previous"
# Label for runs started with this config; empty = mongo-<server version>,
# or run-<UTC time> when the version is unknown. At most 64 bytes.
# trend_run_label: ""
# Store query values. On: each run also stores the exact commands of each shape's
# explained samples (plus up to 8 retained samples), so Trends can check whether
# ordinary generated runs used the same query values; this never changes the
# improved/regressed labels. To compare instances with identical operations, use
# Record & Replay instead (replays of one recording compare as the same values
# without stored literals; plgm compare-replays compares them operation by operation).
# The baseline file, exports, Download Summary, and HTML report then contain real
# query values (up to 16 KiB per sample, 1 MiB per run).
# Off (default): only redacted shapes and metrics are stored.
# Env: PLGM_INSIGHTS_TREND_STORE_QUERY_VALUES
insights_trend_store_query_values: false

# ==============================================================================
# Sharding Strategy
# ==============================================================================
# Controls how generic sharding setup is applied per collection.
# Modes:
# - auto: detect per collection (recommended)
# - force_on: require mongos and apply sharding setup
# - force_off: never apply sharding setup
sharding_mode: "auto"

# When true, collections without explicit shardConfig are skipped by generic sharding setup.
# Recommended for mixed workloads where some collections are intentionally unsharded.
sharding_skip_generic_without_config: true

# ==============================================================================
# Workload Definition
# ==============================================================================

# If true, plgm will only run the default workload default (resources/collections/default.json).
# If false, loads custom JSON files from the paths below.
default_workload: true

# Directories containing your custom JSON schema and query definitions.
# Required if default_workload is false.
collections_path: "resources/collections"
queries_path: "resources/queries"

# ==============================================================================
# Workload Behavior
# ==============================================================================
# If true, drops the target collections before starting (Clean Slate).
drop_collections: false

# If true, skips seeding initial data. 
skip_seed: true

# Number of documents to insert during the initialization "Seed" phase.
documents_count: 100000

# Number of concurrent "Active Workers" to spawn.
# Higher = more load, provided the client CPU/Network can handle it.
# When a non-fixed load_profile is configured (see below), this acts as the
# default/fallback worker count; the profile controls active workers over time.
concurrency: 4

# -----------------------------------------------------------------------------
# Load Profile (dynamic concurrency / load shaping)
# -----------------------------------------------------------------------------
# Shapes how many workers are active over the run instead of a flat concurrency.
# The worker pool is sized to the profile's peak; a controller scales how many
# are actively issuing operations as the run progresses. Omit this block (or use
# kind: fixed) to keep the classic fixed-concurrency behavior.
#
# kind: fixed | ramp | step | spike | sine
#
# load_profile:
#   kind: ramp            # ramp from start_workers to end_workers over ramp_over
#   start_workers: 1
#   end_workers: 50
#   ramp_over: "30s"
#
#   # kind: step          # hold each stage's workers for its duration, then next
#   steps:
#     - { workers: 5,  duration: "30s" }
#     - { workers: 20, duration: "60s" }
#     - { workers: 5,  duration: "30s" }
#
#   # kind: spike         # run at base_workers, jump to peak_workers in a window
#   base_workers: 4
#   peak_workers: 40
#   spike_at: "20s"
#   spike_for: "10s"
#
#   # kind: sine          # oscillate between min_workers and max_workers
#   min_workers: 5
#   max_workers: 40
#   period: "30s"
load_profile:
  kind: fixed

# Duration of the test run. Accepts the following time formats: (e.g., "1m", "30s", "1h").
# Set to "0" to run the queries exactly once and exit.
duration: "10s"

# Client pacing / think time (per worker, between operations).
# think_time_ms: fixed delay each worker waits between operations.
# think_jitter_ms: extra uniform random 0..jitter ms added to each delay.
# Both default to 0 (no pacing = run as fast as possible). Pacing time is
# excluded from measured operation latency. Useful to emulate realistic clients
# or to hold a steady, sub-saturation request rate.
think_time_ms: 0
think_jitter_ms: 0

# Access-pattern skew: how existing records are chosen for find/update/delete.
# kind: uniform (default) | zipfian | hotspot
#   uniform  - every record equally likely (historical behavior).
#   zipfian  - power-law skew toward a few hot records. zipfian_exponent (>=1.0)
#              controls intensity; higher = more skew. Default 1.2.
#   hotspot  - hotspot_percent of records receive hotspot_traffic_percent of
#              traffic (e.g. 20% of records take 80% of operations).
# Example zipfian:
#   access_pattern:
#     kind: zipfian
#     zipfian_exponent: 1.5
# Example hotspot:
#   access_pattern:
#     kind: hotspot
#     hotspot_percent: 20
#     hotspot_traffic_percent: 80
access_pattern:
  kind: uniform

# Number of times to repeat the workload execution.
iterations: 1

# Time to pause between iterations (e.g. "5s", "1m").
interval_delay: "0s"

# Enable transactional workload
use_transactions: false

# The maximum number of operations to group into a single transaction block.
# plgm will pick a random number between 1 and this value for each transaction.
max_transaction_ops: 5

# --- Operation Mix ---
# The percentage of operations allocated to each type.
# Will be normalized automatically if the sum != 100.
find_percent: 60
update_percent: 20
delete_percent: 10
insert_percent: 5
bulk_insert_percent: 5
aggregate_percent: 0
transaction_percent: 0

# Enable application-level debug
debug_mode: false

# ==============================================================================
# Advanced Performance Optimization
# ==============================================================================
# These settings allow fine-grained control over driver behavior and internal buffers.

# --- Read Operations ---
find_batch_size: 10             # Documents returned per network round-trip.
find_limit: 5                   # Hard limit on documents returned per Find query.
use_findone_for_limit_one: true # Optimization: use FindOne() if limit is 1.

# --- Write Operations ---
insert_cache_size: 1000         # Size of the internal buffer for generated documents.
insert_batch_size: 10           # Number of documents per InsertMany call during WORKLOAD phase.
seed_batch_size: 1000           # Number of documents per InsertMany call during SEED phase.
seed_concurrency: 1             # Concurrent seed writers, independent of workload concurrency.

# --- Monitoring ---
status_refresh_rate_sec: 1      # How often (seconds) to print the "AVG Ops/Sec" log line.

# --- Reliability ---
# Hard timeout (milliseconds) for individual DB operations. 
# Allows failing fast rather than hanging.
op_timeout_ms: 500              

# Retry logic for transient errors (e.g., network blips).
retry_attempts: 2
retry_backoff_ms: 5

# --- Workload Realism ---
# Percentage (0-100) of find/update/delete operations that target known existing records.
# The generator caches inserted/sampled documents in a "record pool" and uses real
# field values to fill query placeholders (e.g. <int>, <string>), so find/update/delete
# operations actually hit existing data instead of missing on random values.
existing_record_hit_rate: 90
# Maximum inserted-record snapshots kept in memory per collection.
record_pool_max_size: 10000
# Sample up to this many existing documents per collection at workload start (0 disables).
record_pool_bootstrap_sample: 500

# --- Reproducible Workload (Record & Replay) ---
# Run the exact same operations, with the same values, on two instances: record on
# one, replay on the other. Off by default. Record and replay cannot both be on for
# the same run, and neither works with the raw injector. For a full upgrade-test
# workflow (record or import, replay on several targets, compare outcomes), see the
# README section "Comparing Two Instances (Upgrade Testing)".
#
# Random seed. Set (non-zero): seeds data and query generation, so the same seed,
# documents count, and collection definitions seed identical documents on any
# instance; use it on both sides of a replay. 0 (default): values are time-based and
# differ every run. Env: PLGM_RANDOM_SEED
random_seed: 0
# Record workload. On: writes every operation sent, with its exact values, to the
# recording file so it can be replayed on another instance. The file contains real
# query values, and recording adds about 2 µs per operation. Every iteration is
# recorded into the one file, and a replay runs them in order. Off (default): nothing
# is recorded. Env: PLGM_WORKLOAD_RECORD_ENABLED
workload_record_enabled: false
# Recording file. Set: NDJSON file, written with mode 0600; an existing file that is
# not a recording is never overwritten. Empty (default): plgm_workload_record.ndjson
# in the working directory when recording is on. Env: PLGM_WORKLOAD_RECORD_PATH
# workload_record_path: ""
# Max recording size in bytes. Set: when the uncompressed size reaches this many
# bytes the recording stops and is marked truncated; the run continues. 0: unlimited;
# watch the free disk space. Empty (default): 536870912 (512 MiB).
# Env: PLGM_WORKLOAD_RECORD_MAX_BYTES
# workload_record_max_bytes: 536870912
# When the writer falls behind. block: workers wait for the writer, so every
# operation is recorded; throughput may drop, and the total and longest wait are
# reported. fail (default): the recording stops and is marked failed; the run
# continues at full speed. Env: PLGM_WORKLOAD_RECORD_BACKPRESSURE
workload_record_backpressure: "fail"
# Recording compression. zstd / gzip: compresses the file (typically 10-15x
# smaller; zstd is faster) at some extra writer CPU; replay and upload detect it.
# The size cap counts uncompressed bytes. none (default): plain NDJSON.
# Env: PLGM_WORKLOAD_RECORD_COMPRESSION
workload_record_compression: "none"
# Replay workload. On: no operations are generated; the recorded operations run on
# the recorded worker count until the file ends. Duration, load profile, access
# pattern, and think time are ignored. Iterations is ignored too: the replay runs
# once and replays every recorded iteration in order. Off (default): operations are
# generated as usual. Env: PLGM_WORKLOAD_REPLAY_ENABLED
workload_replay_enabled: false
# Recording to replay. Set: the recording to replay (in the Web UI an uploaded file
# is used instead and deleted after the run). Empty (default): nothing to replay;
# required when replay is on. Env: PLGM_WORKLOAD_REPLAY_PATH
# workload_replay_path: ""
# Replay mode. timed: sends each operation at its recorded offset from the start and
# reports how far behind it fell (lag). per_worker (default): each worker sends its
# recorded operations in order, as fast as possible. Env: PLGM_WORKLOAD_REPLAY_MODE
workload_replay_mode: "per_worker"
# Allow mismatch. On: replays even when the collection/query definitions or
# namespaces differ from the recording, or the recording did not complete; results
# may not be comparable. Off (default): such a replay fails before any operation is
# sent. Env: PLGM_WORKLOAD_REPLAY_ALLOW_MISMATCH
workload_replay_allow_mismatch: false
# Deterministic generated traffic. On: every operation is generated from
# (random_seed, iteration, worker, operation number), so two runs with the same
# settings send the same commands with the same values, without a recording file.
# Each worker sends exactly operations_per_worker operations; failures and retries
# do not shift later operations. Needs a non-zero random_seed, drop_collections on
# and skip_seed off, and a fixed worker count; duration becomes a safety timeout
# (the run is marked incomplete if it is hit). The insert cache and bootstrap are
# not used. The run reports a traffic fingerprint (hashes only). Cross-worker
# interleaving, server-generated values, and results on different data can still
# differ. Off (default): operations are generated as usual until duration ends.
# Env: PLGM_WORKLOAD_DETERMINISTIC
workload_deterministic: false
# Operations per worker. Set: each worker sends exactly this many operations per
# iteration; required when workload_deterministic is on. 0 (default): no budget;
# workers run until duration ends. Env: PLGM_OPERATIONS_PER_WORKER
operations_per_worker: 0
# Record outcomes. On: keeps what every operation returned: client latency, ok or
# the error code and code name (never the message), and a result summary
# (find/aggregate documents returned; inserted; matched/modified/upserted;
# deleted; transaction commit/abort). A recording stores it on each operation
# line; a replay writes workload_replay_outcomes_path; a deterministic run writes
# workload_deterministic_outcomes_path or, when recording, the recording. The
# commands sent, stats, insights, and trends do not change. Needs a recording, a
# replay, or a deterministic run. Off (default): no outcomes; recordings are
# unchanged. Env: PLGM_WORKLOAD_RECORD_OUTCOMES
workload_record_outcomes: false
# Result checksums. On: adds an order-sensitive sha256 of every find/aggregate
# result (each returned document as canonical Extended JSON with keys sorted) to
# its outcome. Costs about 5 us of worker CPU and a copy per returned document,
# hashed after the latency is measured. Needs workload_record_outcomes on.
# Off (default): document counts only. Env: PLGM_WORKLOAD_RECORD_RESULT_CHECKSUMS
workload_record_result_checksums: false
# Replay outcome file (NDJSON, mode 0600). Set: a replay writes one outcome per
# replayed operation, keyed by the recording's sequence numbers; required when
# workload_record_outcomes is on during a replay. An existing file that is not an
# outcome file is never overwritten. Empty (default): no outcome file.
# Env: PLGM_WORKLOAD_REPLAY_OUTCOMES_PATH
workload_replay_outcomes_path: ""
# Deterministic outcome file (NDJSON, mode 0600). Set: a deterministic run writes
# one outcome per operation, keyed by (iteration, worker, operation number) and
# stamped with the traffic fingerprint. Empty (default): no outcome file.
# Env: PLGM_WORKLOAD_DETERMINISTIC_OUTCOMES_PATH
workload_deterministic_outcomes_path: ""
# Replay operations. reads_only: replays finds and read-only aggregates and skips
# every write (inserts, updates, deletes, transactions with a write, aggregates
# with $out or $merge), so the target keeps its starting data; skipped writes are
# counted and reported, and the commands hash is not compared. all (default):
# replays every recorded operation, including writes. Env: PLGM_WORKLOAD_REPLAY_OPS
workload_replay_ops: "all"
# Starting-data fingerprint. counts / dbhash: a recording stores each collection's
# document count and index list (plus the dbHash collection hash with dbhash)
# before the first operation; every replay of it compares them with its target
# first and fails on a difference (warns with workload_replay_allow_mismatch).
# dbhash needs the dbHash privilege, does not run through mongos, and matches only
# byte-identical copies (a snapshot or mongodump restore), not separately seeded
# ones. A replay always checks a recording that has a fingerprint. off (default):
# nothing is stored or checked. Env: PLGM_WORKLOAD_DATA_FINGERPRINT
workload_data_fingerprint: "off"
# Multi-target replay. Listed (2-8 targets): the replay (or deterministic run)
# runs once on every listed target, and only on those: uri is not used. Each
# target gets its own client, workers, stats, outcome file (the label goes before
# the extension, e.g. outcomes.m8.ndjson), insights, and trend run, and is
# compared with the first target. Needs workload_replay_enabled or
# workload_deterministic, and workload_record_outcomes with an outcome file.
# username, password, and TLS settings apply to every target; put other
# per-target options in its URI. Empty (default): a single run on uri.
# Env: PLGM_WORKLOAD_REPLAY_TARGETS="m7=mongodb://h7:27017;m8=mongodb://h8:27017"
# CLI: --replay-target m7=mongodb://h7:27017 --replay-target m8=mongodb://h8:27017
# workload_replay_targets:
#   - label: m7
#     uri: "mongodb://h7:27017"
#   - label: m8
#     uri: "mongodb://h8:27017"
workload_replay_targets: []
# Targets mode. concurrent: every target is prepared first, one at a time, then
# all run at once from this host; they share its CPU, memory, and network, so
# latencies may be affected, and the report shows each target's client-side lag
# behind the recorded timeline. sequential (default): targets run one after
# another and do not compete for this host. Env: PLGM_WORKLOAD_REPLAY_TARGETS_MODE
# CLI: --replay-targets-mode
workload_replay_targets_mode: "sequential"

# --- Global Pool Overrides ---
# These override connection_params if set here, providing runtime flexibility.
max_pool_size: 1000
min_pool_size: 20

# ==============================================================================
# Raw Injector (High Performance Hardware Test)
# ==============================================================================
raw_injector:
  enabled: false
  drop_collection: false
  type: "mixed"            # Options: insert, upsert, find, update, delete, mixed
  document_size: 200
  max_docs: 10000000
  batch_size: 1000
  db_name: "plgm_injector"
  collection_name: "injector_data"
