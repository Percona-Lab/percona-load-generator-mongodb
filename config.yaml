# ==============================================================================
# Connection Settings
# ==============================================================================

# The primary connection string for the MongoDB target. 
# Can be overridden via environment variable: PLGM_URI
uri: "mongodb://dan-ps-lab-mongos00.tp.int.percona.com,dan-ps-lab-mongos01.tp.int.percona.com:27017"

# --- Connection Tuning ---
# Standard driver parameters to control behavior and resource usage.
connection_params:
  # Credentials (Optional)
  # You can set the username here or via env PLGM_USERNAME.
  # Password is NOT set here. Use PLGM_PASSWORD. If not set, the interactive prompt will ask for it
  username: ""
  auth_source: admin             # Database to authenticate against
  direct_connection: false       # Connect directly to the host (bypass topology discovery if single node), use True if replicaset, False if connecting to a sharded cluster
  replicaset_name: ""            # Required if connecting to a Replica Set, set to "" if connecting to a sharded cluster
  read_preference: nearest
  connection_timeout: 30         # Time (seconds) to wait for an initial connection
  server_selection_timeout: 15   # Time (seconds) to wait to find a suitable server for an op
  
  # Pooling: Important for high concurrency.
  # Ensure max_pool_size is > concurrency to avoid workers blocking on sockets.
  max_pool_size: 200             
  min_pool_size: 10              
  max_idle_time: 30              # Max time (minutes) an idle connection stays open (prevents churn)
  # TLS client settings are optional.
  # If both fields are provided, PLGM automatically sets tls=true in the MongoDB URI.
  # Leave both blank to connect without TLS.
  tls_ca_file: ""
  tlsCertificateKeyFile: ""

# --- Custom Driver Options ---
# Arbitrary key-values appended to the connection string URI.
# All mongodb connection parameters are supported, just add them below as shown in the examples
custom_params:
  # Network compression. Use "zlib" for slow networks, "snappy" for speed, or remove for none.
  # Disabling compressors could speed up the workload
  compressors: "zlib,snappy"
  
# Enable debug logging (verbose).
debug: false

# Enable PPROF server on localhost:6060 for profiling (default: false)
# Can be overridden via env: PLGM_PPROF_ENABLED=true
pprof_enabled: false

# ==============================================================================
# Web UI Configuration
# ==============================================================================
web_ui:
  enabled: false
  port: 9999
  # By default the Web UI is served over plain HTTP bound to the loopback
  # interface (127.0.0.1). Browsers treat http://localhost as a secure context,
  # so there are NO certificate warnings. Only enable TLS if you expose the UI
  # beyond loopback.
  tls_enabled: false
  # When tls_enabled is true, provide a certificate/key trusted by your clients
  # to avoid browser warnings. If left blank while TLS is enabled, a temporary
  # self-signed certificate is used (browsers will warn until it is trusted).
  tls_cert_file: ""
  tls_key_file: ""

# ==============================================================================
# Metrics Export
# ==============================================================================
# Continuously stream workload throughput metrics to a CSV file for graphing
csv_export_enabled: false
csv_export_append: false # If true, appends to the file. If false, overwrites it.
csv_export_path: "/tmp/plgm_metrics_export.csv"

# ==============================================================================
# Post-Run Insights (Slow Query / Index Analysis)
# ==============================================================================
# Insights are generated after workload completion.
# Explain mode is post-run only and does not execute during the measured workload window.
insights_enabled: true
insights_sampling_rate: 0.10
insights_slow_threshold_ms: 200
insights_max_events: 5000
insights_max_groups: 300
insights_explain_enabled: false
insights_explain_top_n: 5
insights_explain_max_time_ms: 1000
insights_explain_verbosity: "executionStats"
# Modes: high_only (default), medium_only, critical_only, high_and_low
insights_explain_severity_mode: "high_only"
insights_explain_workers: 1
insights_explain_retries: 1
insights_explain_backoff_ms: 150

# ==============================================================================
# Sharding Strategy
# ==============================================================================
# Controls how generic sharding setup is applied per collection.
# Modes:
# - auto: detect per collection (recommended)
# - force_on: require mongos and apply sharding setup
# - force_off: never apply sharding setup
sharding_mode: "auto"

# When true, collections without explicit shardConfig are skipped by generic sharding setup.
# Recommended for mixed workloads where some collections are intentionally unsharded.
sharding_skip_generic_without_config: true

# ==============================================================================
# Workload Definition
# ==============================================================================

# If true, plgm will only run the default workload default (resources/collections/default.json).
# If false, loads custom JSON files from the paths below.
default_workload: true

# Directories containing your custom JSON schema and query definitions.
# Required if default_workload is false.
collections_path: "resources/collections"
queries_path: "resources/queries"

# ==============================================================================
# Workload Behavior
# ==============================================================================
# If true, drops the target collections before starting (Clean Slate).
drop_collections: false

# If true, skips seeding initial data. 
skip_seed: true

# Number of documents to insert during the initialization "Seed" phase.
documents_count: 100000

# Number of concurrent "Active Workers" to spawn.
# Higher = more load, provided the client CPU/Network can handle it.
# When a non-fixed load_profile is configured (see below), this acts as the
# default/fallback worker count; the profile controls active workers over time.
concurrency: 4

# -----------------------------------------------------------------------------
# Load Profile (dynamic concurrency / load shaping)
# -----------------------------------------------------------------------------
# Shapes how many workers are active over the run instead of a flat concurrency.
# The worker pool is sized to the profile's peak; a controller scales how many
# are actively issuing operations as the run progresses. Omit this block (or use
# kind: fixed) to keep the classic fixed-concurrency behavior.
#
# kind: fixed | ramp | step | spike | sine
#
# load_profile:
#   kind: ramp            # ramp from start_workers to end_workers over ramp_over
#   start_workers: 1
#   end_workers: 50
#   ramp_over: "30s"
#
#   # kind: step          # hold each stage's workers for its duration, then next
#   steps:
#     - { workers: 5,  duration: "30s" }
#     - { workers: 20, duration: "60s" }
#     - { workers: 5,  duration: "30s" }
#
#   # kind: spike         # run at base_workers, jump to peak_workers in a window
#   base_workers: 4
#   peak_workers: 40
#   spike_at: "20s"
#   spike_for: "10s"
#
#   # kind: sine          # oscillate between min_workers and max_workers
#   min_workers: 5
#   max_workers: 40
#   period: "30s"
load_profile:
  kind: fixed

# Duration of the test run. Accepts the following time formats: (e.g., "1m", "30s", "1h").
# Set to "0" to run the queries exactly once and exit.
duration: "10s"

# Client pacing / think time (per worker, between operations).
# think_time_ms: fixed delay each worker waits between operations.
# think_jitter_ms: extra uniform random 0..jitter ms added to each delay.
# Both default to 0 (no pacing = run as fast as possible). Pacing time is
# excluded from measured operation latency. Useful to emulate realistic clients
# or to hold a steady, sub-saturation request rate.
think_time_ms: 0
think_jitter_ms: 0

# Access-pattern skew: how existing records are chosen for find/update/delete.
# kind: uniform (default) | zipfian | hotspot
#   uniform  - every record equally likely (historical behavior).
#   zipfian  - power-law skew toward a few hot records. zipfian_exponent (>=1.0)
#              controls intensity; higher = more skew. Default 1.2.
#   hotspot  - hotspot_percent of records receive hotspot_traffic_percent of
#              traffic (e.g. 20% of records take 80% of operations).
# Example zipfian:
#   access_pattern:
#     kind: zipfian
#     zipfian_exponent: 1.5
# Example hotspot:
#   access_pattern:
#     kind: hotspot
#     hotspot_percent: 20
#     hotspot_traffic_percent: 80
access_pattern:
  kind: uniform

# Number of times to repeat the workload execution.
iterations: 1

# Time to pause between iterations (e.g. "5s", "1m").
interval_delay: "0s"

# Enable transactional workload
use_transactions: false

# The maximum number of operations to group into a single transaction block.
# plgm will pick a random number between 1 and this value for each transaction.
max_transaction_ops: 5

# --- Operation Mix ---
# The percentage of operations allocated to each type.
# Will be normalized automatically if the sum != 100.
find_percent: 60
update_percent: 20
delete_percent: 10
insert_percent: 5
bulk_insert_percent: 5
aggregate_percent: 0
transaction_percent: 0

# Enable application-level debug
debug_mode: false

# ==============================================================================
# Advanced Performance Optimization
# ==============================================================================
# These settings allow fine-grained control over driver behavior and internal buffers.

# --- Read Operations ---
find_batch_size: 10             # Documents returned per network round-trip.
find_limit: 5                   # Hard limit on documents returned per Find query.
use_findone_for_limit_one: true # Optimization: use FindOne() if limit is 1.

# --- Write Operations ---
insert_cache_size: 1000         # Size of the internal buffer for generated documents.
insert_batch_size: 10           # Number of documents per InsertMany call during WORKLOAD phase.
seed_batch_size: 1000           # Number of documents per InsertMany call during SEED phase.

# --- Monitoring ---
status_refresh_rate_sec: 1      # How often (seconds) to print the "AVG Ops/Sec" log line.

# --- Reliability ---
# Hard timeout (milliseconds) for individual DB operations. 
# Allows failing fast rather than hanging.
op_timeout_ms: 500              

# Retry logic for transient errors (e.g., network blips).
retry_attempts: 2
retry_backoff_ms: 5

# --- Workload Realism ---
# Percentage (0-100) of find/update/delete operations that target known existing records.
# The generator caches inserted/sampled documents in a "record pool" and uses real
# field values to fill query placeholders (e.g. <int>, <string>), so find/update/delete
# operations actually hit existing data instead of missing on random values.
existing_record_hit_rate: 90
# Maximum inserted-record snapshots kept in memory per collection.
record_pool_max_size: 10000
# Sample up to this many existing documents per collection at workload start (0 disables).
record_pool_bootstrap_sample: 500

# Deterministic data generation. When non-zero, the seed dataset is fully reproducible
# and each worker stream is seeded from this base (best-effort under concurrency).
# Leave 0 (default) for time-based, non-deterministic generation.
# Can be overridden via env: PLGM_RANDOM_SEED
random_seed: 0

# --- Global Pool Overrides ---
# These override connection_params if set here, providing runtime flexibility.
max_pool_size: 1000
min_pool_size: 20

# ==============================================================================
# Raw Injector (High Performance Hardware Test)
# ==============================================================================
raw_injector:
  enabled: false
  drop_collection: false
  type: "mixed"            # Options: insert, upsert, find, update, delete, mixed
  document_size: 200
  max_docs: 10000000
  batch_size: 1000
  db_name: "plgm_injector"
  collection_name: "injector_data"
